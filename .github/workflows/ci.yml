name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on the default branch: it may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            pnpm exec playwright install --with-deps
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Checks
        env:
          E2E_ALL_BROWSERS: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: scripts/ci-check.sh

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the history, not just the last commit

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Dependency audit
        # Reported on PRs, blocking on main.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pnpm audit --prod --audit-level high

      - name: Secret scan
        # The gitleaks container, not gitleaks-action: the action needs a paid licence on organisations.
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner

  # ── Deployment (4.22) — one reusable workflow per target ──
  deploy-preview:
    needs: [check]
    # Forks never deploy: their code must not run with this repository's secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write # the preview URL comment
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      environment: preview
    secrets: inherit

  deploy-production:
    needs: [check, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: write # granted to the called workflow; it comments only on PRs
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      environment: production
    secrets: inherit
