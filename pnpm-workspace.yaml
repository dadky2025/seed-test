# Exact versions in package.json; Renovate/Dependabot move them deliberately.
saveExact: true

# Supply chain: never install a version younger than 3 days (malicious releases are usually caught and
# unpublished within hours). Renovate uses the same delay (4.28).
minimumReleaseAge: 4320

# Dependency install scripts are blocked unless listed here. Decide each one the first `pnpm install`
# reports — never set a blanket allow. Keep a comment with the reason for every `true`.
allowBuilds:
  esbuild: false # the binary ships as an optional dependency; the postinstall is not needed
  lefthook: false # hooks are installed by the `prepare` script instead
  msw: false # its postinstall only copies the service worker

# A package published with weaker provenance than its previous version is refused.
trustPolicy: no-downgrade
# Known downgrades the first install reports (deploy CLIs, eslint-config-next and vitest pull several), each with its reason:
trustPolicyExclude:
  - vercel@60.1.3 # published without provenance by the vendor; pinned exactly
  - '@vercel/backends@11.0.1' # trust downgrade reported by pnpm install (transitive dependency); pinned by the lockfile
